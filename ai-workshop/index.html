<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leveraging AI: Transforming my team's workflows · Sam Perniskie</title>
  <link rel="stylesheet" href="assets/css/styles.css">

  <style>
    /* ===== Portfolio site chrome ==========================================
       Lets a reader navigate back to the main site instead of dead-ending in
       the artefact. Deliberately uses SYSTEM fonts and no network requests:
       this deck's whole point is that it runs offline from a filesystem with
       no CDN, and the chrome must not be what breaks that. Night palette,
       matching the portfolio, so it reads as site furniture framing a light
       document rather than part of the deck. */
    .site-chrome{--c-night:#101229;--c-paper:#faf8f4;--c-dim:#cdd3f2;--c-accent:#9db2ff;
      background:var(--c-night);color:var(--c-dim);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      font-size:15px;line-height:1.5}
    .site-chrome a{color:var(--c-dim);text-decoration:none}
    .site-chrome a:hover,.site-chrome a:focus-visible{color:var(--c-paper)}
    .site-chrome a:focus-visible{outline:3px solid var(--c-accent);outline-offset:3px;border-radius:3px}
    .sc-inner{max-width:1100px;margin:0 auto;padding:14px 24px;
      display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .sc-mast{font-weight:700;font-size:17px;letter-spacing:-.01em;color:var(--c-paper)}
    .sc-nav{display:flex;gap:22px;list-style:none;margin:0;padding:0;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:12px;letter-spacing:.14em;text-transform:uppercase}
    .sc-foot .sc-inner{align-items:flex-start;padding:26px 24px 30px}
    .sc-back{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:12px;letter-spacing:.14em;text-transform:uppercase}
    .sc-note{margin:8px 0 0;max-width:62ch;font-size:13px;color:#8f97c4}
    @media (max-width:640px){.sc-inner{padding:12px 16px}.sc-nav{gap:14px}}
  </style>
</head>
<body>

<header class="site-chrome sc-head">
  <div class="sc-inner">
    <a class="sc-mast" href="/portfolio_2026/">Sam Perniskie</a>
    <nav aria-label="Site">
      <ul class="sc-nav">
        <li><a href="/portfolio_2026/#work">Work</a></li>
        <li><a href="/portfolio_2026/about/">About</a></li>
        <li><a href="/portfolio_2026/cv/">CV</a></li>
      </ul>
    </nav>
  </div>
</header>

  <!-- The engine renders everything into #app. -->
  <div id="app" aria-live="polite"></div>

  <!--
    Classic scripts only — NO type="module". No CDN / external links.
    Order matters: data.js defines CASE_STUDIES + TALK; app.js consumes them.
  -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>

<footer class="site-chrome sc-foot">
  <div class="sc-inner">
    <div>
      <a class="sc-back" href="/portfolio_2026/#work">&larr; Back to selected work</a>
      <p class="sc-note">An internal talk, published as a working artefact. Company, product
      and page identifiers are redacted throughout; participant material is blurred.</p>
    </div>
    <a class="sc-back" href="/portfolio_2026/">samperniskie.com</a>
  </div>
</footer>
</body>
</html>
